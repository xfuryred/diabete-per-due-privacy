<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 850 550" width="85mm" height="55mm">
  <defs>
    <linearGradient id="backBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="backAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="backShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="850" height="550" fill="url(#backBgGrad)"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="850" height="12" fill="url(#backAccent)"/>

  <!-- Left Column: Big Headline & Instructions -->
  <g class="font-sans" transform="translate(50, 45)">
    <!-- Header Badge -->
    <rect x="0" y="0" width="165" height="26" rx="13" fill="#e0f2fe"/>
    <text x="14" y="17" font-size="12" font-weight="800" fill="#0369a1">ANTEPRIMA GRATUITA</text>

    <text x="0" y="65" font-size="34" font-weight="900" fill="#0f172a" letter-spacing="-0.5">Scansiona con</text>
    <text x="0" y="105" font-size="34" font-weight="900" fill="#0284c7" letter-spacing="-0.5">lo smartphone!</text>

    <text x="0" y="145" font-size="14.5" font-weight="600" fill="#334155" width="400">
      <tspan x="0" dy="0">Inquadra il QR code con la fotocamera</tspan>
      <tspan x="0" dy="24">per accedere alla pagina del progetto,</tspan>
      <tspan x="0" dy="24">provare l'app in anteprima su Google Play</tspan>
      <tspan x="0" dy="24">o unirti ai nostri tester ufficiali.</tspan>
    </text>

    <!-- 3 Quick Step Icons -->
    <g transform="translate(0, 245)">
      <!-- Step 1 -->
      <circle cx="16" cy="16" r="16" fill="#f1f5f9"/>
      <text x="11" y="22" font-size="15" font-weight="800" fill="#0284c7">1</text>
      <text x="42" y="15" font-size="13" font-weight="700" fill="#0f172a">Apri la fotocamera</text>
      <text x="42" y="29" font-size="11.5" font-weight="500" fill="#64748b">Punta verso il codice a destra</text>

      <!-- Step 2 -->
      <g transform="translate(0, 48)">
        <circle cx="16" cy="16" r="16" fill="#f1f5f9"/>
        <text x="11" y="22" font-size="15" font-weight="800" fill="#0284c7">2</text>
        <text x="42" y="15" font-size="13" font-weight="700" fill="#0f172a">Apri il link</text>
        <text x="42" y="29" font-size="11.5" font-weight="500" fill="#64748b">Vedi presentazione o unisciti al test</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(0, 96)">
        <circle cx="16" cy="16" r="16" fill="#f1f5f9"/>
        <text x="11" y="22" font-size="15" font-weight="800" fill="#0284c7">3</text>
        <text x="42" y="15" font-size="13" font-weight="700" fill="#0f172a">Installa e condividi</text>
        <text x="42" y="29" font-size="11.5" font-weight="500" fill="#64748b">Gratis, senza dati personali né ads</text>
      </g>
    </g>

    <!-- Web Link Pill -->
    <g transform="translate(0, 410)">
      <rect width="395" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="14" y="25" font-size="12" font-weight="700" fill="#64748b">SITO:</text>
      <text x="56" y="25" font-size="13" font-weight="700" fill="#0369a1">xfuryred.github.io/diabete-per-due-privacy</text>
    </g>
  </g>

  <!-- Right Column: QR Code Box with shadow -->
  <g transform="translate(485, 45)">
